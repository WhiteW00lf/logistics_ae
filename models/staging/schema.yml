version: 2 
sources:
  - name: raw 
    database: BLAZING_MART
    schema: raw
    freshness:
      warn_after: {count: 24, period: hour}
      error_after: {count: 48, period: hour}
    tables:
      - name: orders
      - name: shipments
      - name: customers
      - name: hubs  
      - name: costs

models:
  - name: stg_shipments
    description: "Cleaned shipment data with standardized columns."
    columns:
      - name: shipment_id
        description: "Unique identifier for each shipment."
        tests:
          - unique
          - not_null

      - name: order_id
        description: "Identifier linking to the corresponding order."
        tests:
          - not_null

      - name: promised_days
        description: "Number of days promised for delivery."
        tests:
          - not_null

      - name: shipped_date
        description: "Date when the shipment was sent."
        tests:
          - not_null

      - name: delivered_date
        description: "Date when the shipment was delivered."
      
  